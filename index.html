<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Guntur Police — Bandobust Duty Search</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f2f4f8;color:#12203c}
header{background:#0b2147;color:#fff;padding:13px 15px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:9;box-shadow:0 2px 10px rgba(0,0,0,.25)}
header img{width:50px;height:50px;object-fit:contain;flex:0 0 auto}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.3px}
header p{margin:2px 0 0;font-size:11px;color:#c6a662;font-weight:700}
.bar{height:4px;background:#c6a662}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.ev{background:#fff;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.6;box-shadow:0 2px 8px rgba(11,33,71,.08);margin-bottom:12px;text-align:center;color:#3c4a66}
.ev b{color:#0b2147;font-size:13px}
.sb{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(11,33,71,.10)}
label{font-size:13px;font-weight:700;color:#0b2147;display:block;margin-bottom:7px}
input,select{width:100%;padding:14px;font-size:17px;border:2px solid #ccd4e4;border-radius:10px;outline:none;font-family:inherit;background:#fff;color:#12203c}
input:focus,select:focus{border-color:#0b2147}
.hint{font-size:11.5px;color:#5d6b85;margin-top:7px;line-height:1.5}
.card{background:#fff;border-radius:14px;margin-top:14px;overflow:hidden;box-shadow:0 2px 10px rgba(11,33,71,.10)}
.card .top{background:#0b2147;color:#fff;padding:12px 14px}
.card .top .nm{font-size:18px;font-weight:800;line-height:1.25}
.card .top .sub{font-size:12px;color:#c8d4ea;margin-top:4px}
.bd{padding:14px}
.sec{margin-bottom:15px}.sec:last-child{margin-bottom:0}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:#7a8398;font-weight:800;margin-bottom:6px}
.duty{border-left:4px solid #c6a662;padding:8px 0 8px 11px;margin-bottom:11px}
.duty:last-child{margin-bottom:0}
.pt{display:inline-block;background:#c6a662;color:#2a2000;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:6px;margin-bottom:5px}
.place{font-size:15.5px;font-weight:700;line-height:1.4;color:#0b2147}
.secn{font-size:11.5px;color:#6b7791;margin-top:3px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef1f6}
.row:last-child{border-bottom:none}
.rl{min-width:0;flex:1}.rl .a{font-size:14px;font-weight:600;line-height:1.35}
.rl .b{font-size:11px;color:#6b7791;margin-top:2px;line-height:1.4}
.call{background:#0b7d3f;color:#fff;text-decoration:none;padding:8px 13px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.rep{background:#e9f0fb;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:700;color:#0b2147;line-height:1.5}
.warn{background:#fff8e6;border-left:4px solid #c6a662;padding:10px 12px;border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.6}
.res-badge{background:#1668c2;color:#fff;display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:800;margin-top:6px;letter-spacing:.4px}
.empty{background:#fff;border-radius:14px;padding:26px 16px;text-align:center;color:#7a8398;font-size:14px;margin-top:14px;box-shadow:0 2px 10px rgba(11,33,71,.08)}
.pick{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:9px;box-shadow:0 2px 8px rgba(11,33,71,.09);display:flex;justify-content:space-between;align-items:center;gap:10px;border:none;width:100%;text-align:left;font-family:inherit;cursor:pointer}
.pick:active{background:#eef2f9}
.pick .a{font-size:14.5px;font-weight:700;color:#0b2147}
.pick .b{font-size:11px;color:#6b7791;margin-top:2px}
.pick .c{font-size:10px;color:#a8823c;font-weight:800;white-space:nowrap;max-width:110px;text-align:right}
.cnt{font-size:13px;font-weight:700;color:#0b2147;margin:16px 0 9px}
.back{background:none;border:none;color:#0b2147;font-size:14px;font-weight:700;padding:12px 0;cursor:pointer;font-family:inherit}
footer{background:#0b2147;color:#9fb0cd;text-align:center;padding:16px;font-size:11px;margin-top:26px;line-height:1.7}
</style></head><body>

$('ev').innerHTML='<b>'+D.event+'</b><br>'+D.venue+'<br>Date: '+D.date+' &nbsp;•&nbsp; Reporting: '+D.report;
[...new Set(D.people.map(p=>p.ps).filter(Boolean))].sort().forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u;$('ps').appendChild(o)});
[...new Set(D.people.flatMap(p=>p.duties.map(d=>d.sector)))].sort().forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u;$('sc').appendChild(o)});
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rk=p=>esc((p.rank?p.rank+' ':'')+(p.gno?p.gno+' ':'')+'— '+p.name).replace('— ','— ');
const isRes=p=>p.duties.some(d=>/RESERVE|ROPE/i.test(d.sector));
function coStaff(p){return D.people.filter(x=>x.id!==p.id&&x.duties.some(a=>p.duties.some(b=>a.sector===b.sector&&a.point===b.point&&a.place===b.place)))}
function card(p){
 const c=coStaff(p),d0=p.duties[0];
 let h='<div class="card"><div class="top"><div class="nm">'+rk(p)+'</div><div class="sub">'+esc(p.ps)+'</div>';
 if(isRes(p))h+='<div class="res-badge">RESERVE / ROPE PARTY</div>';
 h+='</div><div class="bd">';
 h+='<div class="sec"><div class="lbl">Place of Duty'+(p.duties.length>1?' ('+p.duties.length+')':'')+'</div>';
 p.duties.forEach(d=>{h+='<div class="duty">'+(d.point?'<div class="pt">POINT - '+esc(d.point)+'</div>':'')+
  '<div class="place">'+esc(d.place)+'</div><div class="secn">'+esc(d.sector)+'</div></div>'});
 h+='</div>';
 h+='<div class="sec"><div class="lbl">Reporting</div><div class="rep">'+esc(D.report)+'<br><span style="font-weight:500;font-size:13px">As per Bandobust Scheme timings</span></div></div>';
 if(d0&&(d0.ic||d0.ic2)){h+='<div class="sec"><div class="lbl">Sector Incharge</div><div class="warn">';
  if(d0.ic)h+='<b>I/C:</b> '+esc(d0.ic);
  if(d0.ic2)h+='<br><b>2nd I/C:</b> '+esc(d0.ic2);
  h+='</div></div>'}
 if(c.length){h+='<div class="sec"><div class="lbl">Co-staff at this point ('+c.length+')</div>';
  c.slice(0,60).forEach(x=>{h+='<div class="row"><div class="rl"><div class="a">'+rk(x)+'</div><div class="b">'+esc(x.ps)+' &nbsp;•&nbsp; '+esc(x.cell)+'</div></div><a class="call" href="tel:'+esc(x.cell)+'">Call</a></div>'});
  if(c.length>60)h+='<div class="hint">… and '+(c.length-60)+' more</div>';
  h+='</div>'}
 return h+'</div></div>'}
function show(l,head){const r=$('res');
 if(!l.length){r.innerHTML='<div class="empty">No matching record found.<br>Please check the number, or contact the Control Room.</div>';return}
 if(l.length===1){r.innerHTML=card(l[0]);window.scrollTo(0,0);return}
 let h='<div class="cnt">'+esc(head||('Found '+l.length+' records'))+' — tap a name for full details</div>';
 l.slice(0,200).forEach((p,i)=>{h+='<button class="pick" data-i="'+i+'"><span><span class="a">'+rk(p)+'</span><br><span class="b">'+esc(p.ps)+' • '+esc(p.cell)+'</span></span><span class="c">'+esc(p.duties[0].sector)+'</span></button>'});
 if(l.length>200)h+='<div class="hint">Showing first 200 of '+l.length+'. Please narrow your search.</div>';
 r.innerHTML=h;
 r.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{r.innerHTML='<button class="back" id="bk">&larr; Back to list</button>'+card(l[+b.dataset.i]);$('bk').onclick=()=>show(l,head);window.scrollTo(0,0)})}
function srch(q){q=q.trim();if(!q){$('res').innerHTML='';return}
 let h;
 if(/^[0-9]+$/.test(q)){h=D.people.filter(p=>p.cell===q||p.gno===q);
  if(!h.length)h=D.people.filter(p=>p.cell.includes(q)||(p.gno&&p.gno.includes(q)))}
 else{const l=q.toLowerCase();h=D.people.filter(p=>p.name.toLowerCase().includes(l)||(p.ps||'').toLowerCase().includes(l))}
 show(h)}
let t;$('q').addEventListener('input',e=>{clearTimeout(t);$('ps').value='';$('sc').value='';t=setTimeout(()=>srch(e.target.value),200)});
$('ps').addEventListener('change',e=>{const v=e.target.value;$('q').value='';$('sc').value='';
 if(!v){$('res').innerHTML='';return}const h=D.people.filter(p=>p.ps===v);show(h,v+' — '+h.length+' personnel')});
$('sc').addEventListener('change',e=>{const v=e.target.value;$('q').value='';$('ps').value='';
 if(!v){$('res').innerHTML='';return}const h=D.people.filter(p=>p.duties.some(d=>d.sector===v));show(h,v+' — '+h.length+' personnel')});
